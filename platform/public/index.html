<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10121b"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Veya Live"><link rel="manifest" href="/manifest.webmanifest">
  <title>Veya Live · Development</title>
  <style>
    :root{font:16px system-ui,-apple-system,sans-serif;color:#f5f6fb;background:#10121b}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}
    .shell{max-width:550px;margin:auto;min-height:100dvh;padding:24px 18px calc(28px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}header strong{font-size:25px;letter-spacing:-.05em}
    .tag{font-size:12px;border:1px solid #6555b7;color:#d6ccff;border-radius:6px;padding:5px 8px;font-weight:800}
    h1{font-size:31px;letter-spacing:-.05em;margin:0 0 8px}h2{font-size:20px;margin:0 0 8px}p{line-height:1.5;color:#adb4c7}
    .card{background:#1c2030;border:1px solid #373b50;border-radius:20px;padding:20px;margin:18px 0}
    .room-item{width:100%;text-align:left;color:inherit;background:#272b3e;border:1px solid #42465a;border-radius:15px;padding:16px;margin:8px 0}
    .room-item strong,.room-item small{display:block}.room-item small{color:#b1b6ca;margin-top:5px}
    label{display:block;margin:16px 0 7px;font-size:14px;color:#c4c7d7}
    input,select{width:100%;border:1px solid #4a4d60;background:#111421;color:white;padding:13px;border-radius:12px}
    .btn{width:100%;background:#705cf0;color:white;border:0;border-radius:12px;padding:14px 18px;font-weight:750;margin-top:16px}
    .btn:disabled{opacity:.55;cursor:wait}.secondary{background:#31354b}.row{display:flex;gap:9px}.row>*{flex:1}
    video{display:block;width:100%;aspect-ratio:4/5;max-height:60vh;background:#0a0b11;border-radius:18px;object-fit:cover}
    #local{transform:scaleX(-1)}#chatLog{height:170px;overflow:auto;list-style:none;padding:10px;margin:0;background:#141725;border-radius:12px}
    #chatLog li{padding:5px 0;overflow-wrap:anywhere}.status{color:#d8caff;min-height:24px}
    [hidden]{display:none!important}a{color:#b9aaff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bcaeff;outline-offset:3px}
  </style>
</head>
<body><main class="shell">
  <header><strong>Veya Live</strong><span class="tag">DEVELOPMENT</span></header>
  <section id="discover"><h1>Live rooms</h1><p>Only rooms with a connected host appear here.</p><div id="rooms" aria-live="polite">Checking for rooms…</div>
    <div class="card"><h2>Start a room</h2><p>One host and one viewer while the live connection is being built.</p>
      <label for="title">Room title</label><input id="title" maxlength="70" placeholder="What are you streaming?">
      <label for="category">Category</label><select id="category"><option>Chat</option><option>Music</option><option>Gaming</option><option>Other</option></select>
      <button class="btn" id="start">Check camera and start room</button></div>
  </section>
  <section id="room" hidden><h1 id="roomTitle">Room</h1><p id="status" class="status" role="status"></p>
    <video id="remote" autoplay playsinline hidden aria-label="Live host video"></video>
    <video id="local" autoplay playsinline muted hidden aria-label="Your camera preview"></video>
    <div id="invite" class="card" hidden><h2>Invite a viewer</h2><p>The room is live only while this page stays open.</p><button class="btn secondary" id="share">Copy invite link</button></div>
    <div class="card"><h2>Room chat</h2><ul id="chatLog" aria-live="polite"></ul>
      <form id="chatForm" class="row"><input id="chatText" maxlength="280" aria-label="Message" placeholder="Message" required><button class="btn" style="margin:0;flex:0 0 90px">Send</button></form></div>
    <div class="row"><button class="btn secondary" id="mute" hidden>Mute mic</button><button class="btn secondary" id="leave">End / leave</button></div>
  </section>
  <p id="notice" class="status" role="alert"></p>
</main><script type="module" src="/app.js"></script></body></html>
