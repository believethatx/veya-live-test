:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#f7f7fc;background:#090b12}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(at 15% 10%,#29204e,transparent 45%),#090b12}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #bba9ff;outline-offset:3px}.phone{width:min(100%,430px);height:100dvh;position:relative;overflow:hidden;background:#10121b}.screen{height:100%;overflow:auto;padding:24px 20px 105px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{color:#afb3c8;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}h1{font-size:30px;letter-spacing:-.04em;margin:4px 0}h2{font-size:21px;margin:25px 0 14px}p{color:#afb4c8;line-height:1.5;font-size:16px}.pill,.chip{border:1px solid #34384b;background:#202331;border-radius:99px;padding:9px 12px;font-size:14px}.wallet{color:#f9d576;background:#2b271d}.demo{font-size:12px;font-weight:800;color:#d9cbff;border:1px solid #554883;border-radius:7px;padding:5px}.search{width:100%;border:0;padding:14px 16px;background:#1d202c;border-radius:16px;margin:24px 0 18px;color:white}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:20px}.chip.active,.primary{background:#775ff0;border-color:#775ff0}.hero{min-height:250px;border-radius:24px;background:radial-gradient(at 75% 25%,#9f697e,transparent 55%),linear-gradient(145deg,#46406c,#1b202e);padding:20px;display:flex;flex-direction:column;justify-content:space-between}.live{display:inline-block;background:#ed4f75;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:800;width:max-content}.hero h2{font-size:29px;margin:5px 0}.hero p{font-size:14px;margin:0;color:#eee8f0}.primary,.secondary{border:0;border-radius:13px;padding:12px 16px;font-weight:800}.secondary{background:#282b3c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:0;height:180px;border-radius:18px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:linear-gradient(135deg,#594475,#242640)}.card strong{display:block;font-size:17px}.card small{font-size:12px;color:#e1d7ee}.card:nth-child(2){background:linear-gradient(135deg,#9b685a,#342b3d)}.card:nth-child(3){background:linear-gradient(135deg,#536b92,#26273e)}.card:nth-child(4){background:linear-gradient(135deg,#8d577a,#29243e)}.mark{font-size:53px;align-self:center;color:#e0c7f7}.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#171925fa;border-top:1px solid #2a2d3b;padding:10px 3px max(14px,env(safe-area-inset-bottom))}.nav button{flex:1;background:none;border:0;color:#959cb4;display:grid;gap:4px;font-size:12px}.nav b{font-size:23px;line-height:26px}.nav .active{color:#b5a0ff}.nav .go b{background:#795ff0;border-radius:10px;color:white;width:36px;margin:auto}.panel{border:1px solid #303346;background:#1b1e2a;border-radius:20px;padding:22px;margin-top:20px}.panel h2{margin:0 0 8px}.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #2b2d3b;padding:15px 0}.item strong{display:block}.item small,.muted{color:#afb4c8;font-size:14px}.avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#9c77bc,#3e4878);display:grid;place-items:center;font-size:24px;flex:none}.stat{border-radius:17px;background:#202331;padding:15px;flex:1}.stat strong{display:block;font-size:24px;margin:5px 0}.room{position:absolute;inset:0;background:radial-gradient(at 65% 25%,#a87986,#564565 30%,#242539 62%,#10121b);z-index:20;display:flex;flex-direction:column;padding:20px 15px max(22px,env(safe-area-inset-bottom))}.room-head{display:flex;justify-content:space-between;align-items:center}.host{display:flex;gap:8px;align-items:center;background:#151522aa;border-radius:30px;padding:6px}.host .avatar{width:32px;height:32px;border-radius:50%;font-size:20px}.host strong{font-size:14px}.host small{display:block;color:#d8cfe2;font-size:12px}.host button{background:#8068ef;border:0;border-radius:30px;padding:8px;font-size:12px}.close{width:36px;height:36px;border:0;border-radius:50%;background:#292339bb;font-size:22px}.spacer{flex:1;display:grid;place-items:center;color:#ead8f3}.stage{text-align:center}.stage span{font-size:100px}.stage p{color:#eadcf3;font-size:14px}.room h1{font-size:26px}.chat{height:110px;overflow:auto;margin:15px 0;font-size:14px}.chat div{margin:6px 0}.chat strong{color:#dec8ff}.room-actions{display:flex;gap:7px}.room-actions input{min-width:0;flex:1;border:1px solid #ffffff36;background:#ffffff20;border-radius:30px;padding:10px 12px;color:white}.room-actions button{width:39px;height:39px;border:0;border-radius:50%;background:#ffffff30;font-size:18px;flex:none}.room-actions .gift-action{background:#8068ef}.pk{padding:12px;border-radius:15px;background:#171727aa;margin-top:13px}.pk .row{font-size:12px}.bar{height:8px;border-radius:10px;background:#ef698a;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:#9378ff}.backdrop{position:absolute;inset:0;z-index:30;background:#0009;display:flex;align-items:end}.sheet{width:100%;background:#202231;border-radius:25px 25px 0 0;padding:22px 20px 28px;max-height:85%;overflow:auto}.sheet h2{margin:0}.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gift{min-height:100px;background:#292c3c;border:1px solid #3d4054;border-radius:15px;padding:10px 4px}.gift b{display:block;font-size:29px}.gift strong{display:block;font-size:14px}.gift small{color:#f4ce75;font-size:12px}.notice{position:absolute;top:75px;left:18px;right:18px;z-index:40;background:#2a2d40;border:1px solid #7861d7;border-radius:13px;padding:14px;text-align:center;font-size:14px}.room-note{font-size:12px;color:#dcd0eb}.item button{margin-left:auto}.full{width:100%}@media(min-width:550px){.phone{border:8px solid #252837;border-radius:36px;height:min(860px,94dvh);box-shadow:0 28px 90px #0009}}
.camera-stage{position:relative;margin-top:20px;aspect-ratio:4/5;max-height:480px;overflow:hidden;border:1px solid #3e4056;border-radius:23px;background:radial-gradient(at 60% 30%,#51436d,#191c2a 60%);display:grid;place-items:center}.camera-stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera-stage.back video{transform:none}.camera-placeholder{position:absolute;text-align:center;padding:20px;color:#d5d0e5}.camera-placeholder b{display:block;font-size:48px}.camera-stage.active .camera-placeholder{display:none}.host-controls{display:flex;gap:9px;margin-top:14px}.host-controls button{flex:1}.camera-status{margin:13px 0;font-size:14px;color:#c6c9d8;min-height:24px}.camera-disclosure{font-size:14px}
+</style></head><body><div class="phone" id="app"></div><script>
(()=>{const app=document.getElementById('app');const s={tab:'discover',category:'For you',search:'',room:null,sheet:'',coins:1200,following:[],chat:[],pk:false,score:58,notice:'',mediaStatus:'off',micMuted:false,facing:'user'};const hosts=[{name:'Mika',category:'Music',viewers:248,mark:'♫'},{name:'Jules',category:'Chat',viewers:126,mark:'✹'},{name:'Rio',category:'Gaming',viewers:84,mark:'✦'},{name:'Nova',category:'Music',viewers:67,mark:'☾'}];const gifts=[['✨','Spark',10],['🌹','Rose',50],['💜','Heart',100],['🔦','Spotlight',500],['👑','Crown',1000],['☄️','Meteor',2500]];const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;function toast(x){s.notice=x;render();clearTimeout(timer);timer=setTimeout(()=>{s.notice='';render()},2800)}const top=(title,sub)=>`<div class="row"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div><div class="row"><span class="demo">DEMO</span><button class="pill wallet" data-sheet="wallet">✦ ${s.coins}</button></div></div>`;
function cards(){const list=hosts.filter(h=>(s.category==='For you'||s.category==='New'||h.category===s.category)&&h.name.toLowerCase().includes(s.search.toLowerCase()));return list.length?list.map(h=>`<button class="card" data-room="${h.name}"><span class="live">LIVE</span><span class="mark">${h.mark}</span><span><strong>${h.name}</strong><small>${h.category} · ${h.viewers} demo viewers</small></span></button>`).join(''):'<p>No matching demo hosts.</p>'}
function page(){if(s.tab==='discover')return `${top('Discover','Veya Live')}<input class="search" id="search" placeholder="Search hosts" aria-label="Search hosts" value="${esc(s.search)}"><div class="chips">${['For you','Music','Chat','Gaming','New'].map(c=>`<button class="chip ${s.category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div><div class="hero"><span class="live">DEMO LIVE ROOM</span><div class="row"><div><h2>Late night<br>with Mika</h2><p>Music, stories & good energy</p></div><button class="primary" data-room="Mika">Join live</button></div></div><h2>Live right now</h2><div class="grid" id="cards">${cards()}</div>`;
if(s.tab==='following')return `${top('Following','Your people')}${s.following.length?s.following.map(name=>`<div class="item"><div class="avatar">✦</div><div><strong>${name}</strong><small>Demo room available</small></div><button class="pill" data-room="${name}">Watch</button></div>`).join(''):'<div class="panel"><h2>Your circle starts here</h2><p>Follow a host in their room to find them here.</p><button class="primary" data-tab="discover">Explore streams</button></div>'}`;
if(s.tab==='go')return `${top('Go Live','Host studio')}<div class="camera-stage ${s.mediaStatus==='ready'?'active':''} ${s.facing==='environment'?'back':''}"><video id="camera-video" autoplay playsinline muted aria-label="Your camera preview"></video><div class="camera-placeholder"><b>◉</b>Camera preview will appear here</div></div><div class="camera-status" role="status">${s.mediaStatus==='ready'?'Camera ready · '+(s.micMuted?'Microphone muted':'Microphone ready'):s.mediaStatus==='loading'?'Waiting for camera permission…':s.mediaStatus==='denied'?'Camera or microphone access was denied. Check your browser permissions.':s.mediaStatus==='unavailable'?'Camera unavailable on this device or browser.':'Your preview stays on this device.'}</div><div class="host-controls">${s.mediaStatus==='ready'?'<button class="secondary" data-stop>Stop</button><button class="secondary" data-mute>'+(s.micMuted?'Unmute':'Mute')+'</button><button class="secondary" data-flip>Flip camera</button>':'<button class="primary full" data-start>Test camera & mic</button>'}</div><p class="camera-disclosure">This is a local camera check. Other people cannot see or hear you yet.</p>`;
if(s.tab==='inbox')return `${top('Inbox','Messages & activity')}<div class="panel"><h2>Welcome to Veya</h2><p>This tester lets you explore rooms, chat and send demo gifts. Messages to other users will arrive in a later build.</p></div>`;
return `${top('My profile','Your space')}<div style="text-align:center;padding:28px 0"><div class="avatar" style="margin:auto;width:75px;height:75px;font-size:38px">✺</div><h2>You</h2><div class="muted">@newmember · Viewer</div></div><div class="row"><div class="stat"><span class="muted">Following</span><strong>${s.following.length}</strong></div><div class="stat"><span class="muted">Demo coins</span><strong>${s.coins}</strong></div></div><h2>Account</h2><button class="secondary full" data-sheet="wallet">Open wallet</button><div class="panel"><p>Coins and actions are simulated. This version does not take payments or broadcast video.</p><button class="secondary" data-reset>Reset tester</button></div>`}
function room(){if(!s.room)return '';const h=hosts.find(h=>h.name===s.room);return `<section class="room" aria-label="${h.name} demo room"><div class="room-head"><div class="host"><div class="avatar">${h.mark}</div><div><strong>${h.name}</strong><small>Demo live room</small></div><button data-follow>${s.following.includes(h.name)?'Following':'+ Follow'}</button></div><button class="close" data-leave aria-label="Leave room">×</button></div><div class="spacer"><div class="stage"><span>${h.mark}</span><p>Stream preview</p><small class="room-note">Simulated video · no broadcast connected</small></div></div><span class="live">DEMO</span><h1>${h.name==='Mika'?'Late night with Mika':h.name+'’s room'}</h1><div class="muted">${h.category}, stories & good energy</div>${s.pk?`<div class="pk"><div class="row"><strong>${h.name} ${s.score}</strong><span>DEMO PK</span><strong>Opponent 42</strong></div><div class="bar"><span style="width:${100*s.score/(s.score+42)}%"></span></div></div>`:''}<div class="chat">${s.chat.slice(-8).map(([n,m])=>`<div><strong>${esc(n)}</strong> ${esc(m)}</div>`).join('')}</div><form class="room-actions" id="chat-form"><input id="message" maxlength="120" placeholder="Say something…" aria-label="Chat message"><button type="submit" aria-label="Send message">➤</button><button type="button" data-pk aria-label="Toggle demo PK">⚡</button><button type="button" class="gift-action" data-sheet="gifts" aria-label="Send gift">🎁</button></form></section>`}
function sheet(){if(!s.sheet)return '';let body;if(s.sheet==='gifts')body=`<h2>Send a gift</h2><p>Balance: ✦ ${s.coins} demo coins</p><div class="gift-grid">${gifts.map(([icon,name,cost])=>`<button class="gift" data-gift="${cost}" data-name="${name}"><b>${icon}</b><strong>${name}</strong><small>✦ ${cost}</small></button>`).join('')}</div><p>No payment is taken.</p>`;else if(s.sheet==='wallet')body=`<h2>Your wallet</h2><div class="panel"><span class="eyebrow">Available demo coins</span><h1>✦ ${s.coins}</h1></div><p>Try sending a gift from a demo room.</p><button class="primary" data-add>Add 500 demo coins</button><p>Purchases and host earnings are not connected.</p>`;else body=`<h2>Stream setup</h2><p>A preview of the host flow.</p><div class="panel"><div class="eyebrow">Room title</div><h2>Come hang out with me</h2><span class="muted">Chat · Camera preview off</span></div><p>Real broadcasting comes after connecting a video service.</p><button class="primary" data-host>Try host application</button>`;return `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true"><button class="close" style="float:right" data-close aria-label="Close panel">×</button>${body}</div></div>`}
let media=null;function stopMedia(){if(media){media.getTracks().forEach(t=>t.stop());media=null}s.mediaStatus='off';s.micMuted=false}async function startMedia(){if(!navigator.mediaDevices?.getUserMedia){s.mediaStatus='unavailable';render();return}stopMedia();s.mediaStatus='loading';render();try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:s.facing}},audio:true});if(s.tab!=='go'){stream.getTracks().forEach(t=>t.stop());return}media=stream;s.mediaStatus='ready';render()}catch(e){s.mediaStatus=e?.name==='NotAllowedError'?'denied':'unavailable';render()}}function render(){app.innerHTML=`<main class="screen">${page()}</main><nav class="nav">${[['discover','⌂','Discover'],['following','♡','Following'],['go','＋','Go Live'],['inbox','▣','Inbox'],['me','◉','Me']].map(([id,icon,label])=>`<button data-tab="${id}" class="${s.tab===id?'active':''} ${id==='go'?'go':''}"><b>${icon}</b><span>${label}</span></button>`).join('')}</nav>${room()}${sheet()}${s.notice?`<div class="notice" role="status">${esc(s.notice)}</div>`:''}`;const chat=app.querySelector('.chat');if(chat)chat.scrollTop=chat.scrollHeight;const video=document.getElementById('camera-video');if(video&&media){video.srcObject=media;video.play().catch(()=>{})}}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.classList.contains('backdrop')){s.sheet='';render()}return}if(b.dataset.tab){if(s.tab==='go'&&b.dataset.tab!=='go')stopMedia();s.tab=b.dataset.tab;s.room=null;s.sheet='';render()}else if(b.dataset.category){s.category=b.dataset.category;render()}else if(b.dataset.room){s.room=b.dataset.room;s.pk=false;s.score=58;s.chat=[['Ari','Welcome in 💜'],['Noah','Good energy tonight!']];render()}else if(b.hasAttribute('data-start'))startMedia();else if(b.hasAttribute('data-stop')){stopMedia();render()}else if(b.hasAttribute('data-mute')){if(media){s.micMuted=!s.micMuted;media.getAudioTracks().forEach(t=>t.enabled=!s.micMuted);render()}}else if(b.hasAttribute('data-flip')){s.facing=s.facing==='user'?'environment':'user';startMedia()}else if(b.hasAttribute('data-leave')){s.room=null;render()}else if(b.dataset.sheet){s.sheet=b.dataset.sheet;render()}else if(b.hasAttribute('data-close')){s.sheet='';render()}else if(b.hasAttribute('data-follow')){const i=s.following.indexOf(s.room);if(i<0)s.following.push(s.room);else s.following.splice(i,1);render()}else if(b.hasAttribute('data-pk')){s.pk=!s.pk;render()}else if(b.dataset.gift){const cost=Number(b.dataset.gift);if(s.coins<cost){toast('Not enough demo coins. Add more from your wallet.');return}s.coins-=cost;s.chat.push(['You','sent '+b.dataset.name+' ✨']);if(s.pk)s.score+=cost;s.sheet='';toast('Gift sent: '+b.dataset.name+' · '+cost+' coins')}else if(b.hasAttribute('data-add')){s.coins+=500;toast('500 demo coins added')}else if(b.hasAttribute('data-host'))toast('Host applications come with the real app.');else if(b.hasAttribute('data-reset')){s.coins=1200;s.following=[];s.chat=[];toast('Tester reset')}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&media){stopMedia();render()}});app.addEventListener('input',e=>{if(e.target.id==='search'){s.search=e.target.value;document.getElementById('cards').innerHTML=cards()}});app.addEventListener('submit',e=>{if(e.target.id!=='chat-form')return;e.preventDefault();const input=document.getElementById('message');if(input.value.trim()){s.chat.push(['You',input.value.trim()]);render();document.getElementById('message').focus()}});render();window.veyaDemo={snapshot:()=>JSON.parse(JSON.stringify(s))}; if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_demo_state',description:'Read the current Veya prototype screen and simulated coin balance.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({screen:s.tab,room:s.room,coins:s.coins,following:[...s.following]})})).catch(()=>{});}catch{}}})();
</script></body></html>
